permissions: read-all

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Without this, a stalled download runs to GitHub's 6-hour ceiling.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install TA-Lib (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          # GitHub releases first: SourceForge redirects to volunteer mirrors
          # that can stall a connection indefinitely. Both sources are checked
          # against the same pinned digest, so either is equally trusted.
          wget --timeout=30 --tries=3 -q -O ta-lib-0.4.0-src.tar.gz \
            "https://github.com/TA-Lib/ta-lib/releases/download/v0.4.0/ta-lib-0.4.0-src.tar.gz" || \
          wget --timeout=30 --tries=3 -q -O ta-lib-0.4.0-src.tar.gz \
            "https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz"
          echo "9ff41efcb1c011a4b4b6dfc91610b06e39b1d7973ed5d4dee55029a0ac4dc651  ta-lib-0.4.0-src.tar.gz" | sha256sum -c -
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..

      - name: Install TA-Lib (macOS)
        if: runner.os == 'macOS'
        run: brew install ta-lib

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with black
        run: uv run black --check .

      - name: Type check with mypy
        continue-on-error: true
        run: uv run mypy strategies/ brokers/ engine/ utils/

      - name: Run strict warning gate
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_TEST }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_TEST }}
          PAPER: "True"
        run: |
          uv run pytest tests/unit/ --no-cov \
            -W error \
            -W ignore::DeprecationWarning \
            -W ignore::PendingDeprecationWarning \
            -W ignore::pytest.PytestUnraisableExceptionWarning

      - name: Run tests with coverage
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_TEST }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_TEST }}
          PAPER: "True"
        run: uv run pytest tests/unit/

      - name: Preserve full coverage report
        run: mv coverage.xml coverage_full.xml

      - name: Run patch coverage report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_TEST }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_TEST }}
          PAPER: "True"
          COVERAGE_FILE: .coverage.patch
        run: |
          uv run pytest \
            tests/unit/engine/test_backtest_engine.py \
            tests/unit/engine/test_walk_forward_backtest.py \
            tests/unit/misc/test_config_credentials_runtime.py \
            --cov=engine.backtest_engine \
            --cov=main \
            --cov-report=xml:coverage_patch.xml \
            --cov-fail-under=0 \
            -q

      - name: Upload coverage reports
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ./coverage_full.xml,./coverage_patch.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
