[project]
name = "trading-bot"
version = "3.0.0"
description = "Alpaca paper-trading bot with a walk-forward-validated backtester; the validated strategy does not beat buy-and-hold"
authors = [
    {name = "gr8monk3ys"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "MIT"}
keywords = ["trading", "algorithmic-trading", "alpaca", "quantitative-finance", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core trading
    "alpaca-py>=0.22.0",
    # Note: lumibot removed - caused import crashes, built custom implementation

    # Data & Analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",

    # Technical Analysis
    "ta-lib>=0.4.28",
    "yfinance>=0.2.28",

    # Visualization (main.py backtest --plot)
    "matplotlib>=3.7.0",

    # Utilities
    "python-dotenv>=1.2.2",
    "aiohttp>=3.14.3",
    "requests>=2.33.0",
    "pytz>=2023.3",

    # Async
    "aiosqlite>=0.19.0",

    # Web Dashboard
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    # httpx2 is the legitimate successor of httpx (author Tom Christie,
    # github.com/pydantic/httpx2) and the required TestClient backend for
    # starlette>=1.x — NOT a typosquat; provenance verified 2026-08-17.
    "httpx2>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "pre-commit>=3.3.3",
]

test = [
    # See dev group note: legitimate starlette-1.x TestClient backend.
    "httpx2>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/gr8monk3ys/trading-bot"
Documentation = "https://github.com/gr8monk3ys/trading-bot/blob/main/README.md"
Repository = "https://github.com/gr8monk3ys/trading-bot"
Issues = "https://github.com/gr8monk3ys/trading-bot/issues"

[project.scripts]
trading-bot = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Security floors for transitive dependencies (Dependabot alerts 2026-08-17):
# starlette (via fastapi), urllib3/idna (via requests), msgpack (via alpaca-py),
# pygments (via pytest/rich), curl-cffi (via yfinance).
#
# This is the only place a transitive floor has any effect on what ships: the
# image is built with `uv sync --frozen` from uv.lock, so the matching floors
# in requirements.txt never reach the container.
constraint-dependencies = [
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "msgpack>=1.2.1",
    "idna>=3.15",
    "pygments>=2.20.0",
    # CVE-2026-33752: redirect-based SSRF reaching internal networks.
    "curl-cffi>=0.15.0",
]

[tool.setuptools]
packages = ["strategies", "brokers", "engine", "utils"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | data
  | results
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/dashboard.py" = ["E402"]
"scripts/kill_switch.py" = ["E402"]
"scripts/quickstart.py" = ["E402"]
"scripts/simple_trader.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "alpaca.*",
    "lumibot.*",
    "talib.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["strategies", "brokers", "engine", "utils"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/examples/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
